services:
  backend:
    image: ${ECR_REGISTRY}/${BACKEND_REPO}:${BACKEND_TAG}
    container_name: backend
    ports:
      - "8080:8080"
      - "9101:9101"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      JAVA_OPTS: ${JAVA_OPTS:-}
      TZ: Asia/Seoul
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

    logging:
      options:
        max-size: "10m"
        max-file: "5"

    stop_grace_period: 30s