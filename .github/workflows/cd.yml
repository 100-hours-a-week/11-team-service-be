name: Backend CD

on:
  workflow_dispatch: # 수동 실행
  push:
    branches: [develop, main]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - ".git*"

permissions:
  id-token: write # AWS OIDC 인증에 필요
  contents: read
  actions: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'scuad-backend' }}
  TARGET_BRANCH: ${{ github.ref_name }}

jobs:
  deploy:
    name: Deploy to EC2 (private subnet) via SSM 
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Getting deploy target & image tag 
        id: meta
        run: |
          if [[ ${{ env.TARGET_BRANCH}} == "main" ]]; then
            PROFILE="prod"
            ENV_TAG_VALUE="prod"
            COMPOSE_S3_URI="${{ secrets.PROD_COMPOSE_S3_URI }}"
            ENV_PARAM_NAME="${{ secrets.PROD_ENV_PARAM_NAME }}"
          else
            PROFILE="dev"
            ENV_TAG_VALUE="dev"
            COMPOSE_S3_URI="${{ secrets.DEV_COMPOSE_S3_URI }}"
            ENV_PARAM_NAME="${{ secrets.DEV_ENV_PARAM_NAME }}"
          fi

          if [[ -z "$COMPOSE_S3_URI" ]]; then
            echo "::error::COMPOSE_S3_URI is empty. Set DEV_COMPOSE_S3_URI / PROD_COMPOSE_S3_URI secrets. (example: s3://bucket/be/docker-compose.yml)"
            exit 1
          fi

          if [[ -z "$ENV_PARAM_NAME" ]]; then
            echo "::error::ENV_PARAM_NAME is empty. Set DEV_ENV_PARAM_NAME / PROD_ENV_PARAM_NAME secrets. (example: /staging/be/DOT_ENV)"
            exit 1
          fi

          echo "profile=$PROFILE" >> $GITHUB_OUTPUT
          echo "environment_tag_value=$ENV_TAG_VALUE" >> $GITHUB_OUTPUT
          echo "compose_s3_uri=$COMPOSE_S3_URI" >> $GITHUB_OUTPUT
          echo "env_param_name=$ENV_PARAM_NAME" >> $GITHUB_OUTPUT
          echo "image_tag=${{ env.TARGET_BRANCH}}-latest" >> $GITHUB_OUTPUT

      - name: Deploy with SSM
        shell: bash
        env:
          ENV_TAG_VALUE: ${{ steps.meta.outputs.environment_tag_value }}
          SPRING_PROFILE: ${{ steps.meta.outputs.profile }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          COMPOSE_S3_URI: ${{ steps.meta.outputs.compose_s3_uri }}
          ENV_PARAM_NAME: ${{ steps.meta.outputs.env_param_name }}
        run: |
          set -euo pipefail

          # Get AWS account ID for ECR registry URL
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          ECR_REGISTRY="$ACCOUNT_ID.dkr.ecr.${AWS_REGION}.amazonaws.com"

          SCRIPT=$(cat <<'SSM'
          set -euo pipefail

          mkdir -p /home/ubuntu/backend
          cd /home/ubuntu/backend

          # Download docker-compose.yml from S3
          aws s3 cp "$COMPOSE_S3_URI" ./docker-compose.yml --region "$AWS_REGION"
          
          # Get environment variables from SSM Parameter Store and save to .env
          aws ssm get-parameter --name "$ENV_PARAM_NAME" --with-decryption --query "Parameter.Value" --output text --region "$AWS_REGION" > ./.env
          chmod 600 ./.env || true

          # Login to ECR
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          # Pull new images and deploy with docker compose
          docker compose --env-file ./.env -f ./docker-compose.yml pull
          docker compose --env-file ./.env -f ./docker-compose.yml up -d --remove-orphans

          docker ps --filter "name=backend" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}"
          SSM
          )

          # Escape the script for safe passing to SSM (handles newlines, quotes, etc.)
          ESCAPED_SCRIPT=$(python3 -c 'import json,sys; s=sys.stdin.read(); print(json.dumps(s)[1:-1])' <<< "$SCRIPT")

          # Send the command to instances with the specified tags
          CMD_ID=$(aws ssm send-command \
            --targets "Key=tag:Environment,Values=${ENV_TAG_VALUE}" "Key=tag:Tier,Values=app" "Key=tag:Role,Values=spring" \
            --document-name "AWS-RunShellScript" \
            --comment "backend deploy via docker compose" \
            --parameters commands="[
              \"export AWS_REGION='${AWS_REGION}'\",
              \"export ECR_REGISTRY='${ECR_REGISTRY}'\",
              \"export BACKEND_REPO='${ECR_REPOSITORY}'\",
              \"export BACKEND_TAG='${IMAGE_TAG}'\",
              \"export SPRING_PROFILES_ACTIVE='${SPRING_PROFILE}'\",
              \"export COMPOSE_S3_URI='${COMPOSE_S3_URI}'\",
              \"export ENV_PARAM_NAME='${ENV_PARAM_NAME}'\",
              \"bash -lc ${ESCAPED_SCRIPT}\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM CommandId: $CMD_ID"

          # With --targets (fan-out), check results per instance.
          for _ in $(seq 1 120); do
            INVOCATIONS=$(aws ssm list-command-invocations --command-id "$CMD_ID" --details \
              --query 'CommandInvocations[].{InstanceId:InstanceId,Status:Status}' --output json)
            DONE=$(echo "$INVOCATIONS" | python3 -c 'import json,sys; inv=json.load(sys.stdin); print(bool(inv) and all(x.get("Status") in ("Success","Failed","Cancelled","TimedOut") for x in inv))')
            [[ "$DONE" == "True" ]] && break
            sleep 5
          done

          echo "$INVOCATIONS"
          FAIL_COUNT=$(echo "$INVOCATIONS" | python3 -c 'import json,sys; inv=json.load(sys.stdin); print(len([x for x in inv if x.get("Status")!="Success"]))')
          [[ "$FAIL_COUNT" == "0" ]] || { echo "One or more instances failed deploy."; exit 1; }

      - name: Health check with SSM
        id: health_check
        env:
          ENV_TAG_VALUE: ${{ steps.meta.outputs.environment_tag_value }}
        run: |
          set -euo pipefail

          # send-command to run health check script on target instances
          CMD_ID=$(aws ssm send-command \
            --targets "Key=tag:Environment,Values=${ENV_TAG_VALUE}" "Key=tag:Tier,Values=app" "Key=tag:Role,Values=spring" \
            --document-name "AWS-RunShellScript" \
            --comment "backend health check" \
            --parameters commands="$(cat <<'SSM'
          set -euo pipefail

          cd /home/ubuntu/backend

          echo "Waiting for backend to become healthy..."
          for i in $(seq 1 60); do
            # compose defines healthcheck, so Docker will expose it.
            HEALTH=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' backend 2>/dev/null || echo "missing")

            if [[ "$HEALTH" == "healthy" ]]; then
              echo "Container health: healthy"
              exit 0
            fi

            # Fallback HTTP check (covers case when healthcheck isn't defined)
            if wget -qO- http://localhost:9101/actuator/health >/dev/null 2>&1; then
              echo "HTTP health: OK"
              exit 0
            fi

            echo "  [$i/60] not healthy yet (docker=$HEALTH). sleeping..."
            sleep 5
          done

          echo "Health check failed. Dumping logs..." >&2
          docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}" || true
          docker logs --tail 300 backend || true
          exit 1
          SSM
          )" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM CommandId: $CMD_ID"

          # With --targets (fan-out), check results per instance.
          for _ in $(seq 1 120); do
            INVOCATIONS=$(aws ssm list-command-invocations --command-id "$CMD_ID" --details \
              --query 'CommandInvocations[].{InstanceId:InstanceId,Status:Status}' --output json)
            DONE=$(echo "$INVOCATIONS" | python3 -c 'import json,sys; inv=json.load(sys.stdin); print(bool(inv) and all(x.get("Status") in ("Success","Failed","Cancelled","TimedOut") for x in inv))')
            if [[ "$DONE" == "True" ]]; then
              break
            fi
            sleep 5
          done

          echo "$INVOCATIONS"

          echo "$INVOCATIONS" | python3 -c 'import json,sys; inv=json.load(sys.stdin); print("\n".join(x["InstanceId"] for x in inv))' | while read -r IID; do
            echo "--- Output for $IID ---"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$IID" \
              --query '{Status:Status, StandardOutput:StandardOutputContent, StandardError:StandardErrorContent}' \
              --output json || true
          done

          FAIL_COUNT=$(echo "$INVOCATIONS" | python3 -c 'import json,sys; inv=json.load(sys.stdin); bad=[x for x in inv if x.get("Status") != "Success"]; print(len(bad))')
          if [[ "$FAIL_COUNT" != "0" ]]; then
            echo "One or more instances failed the health check step." >&2
            exit 1
          fi

      - name: Notify Discord - Success
        if: steps.health_check.outcome == 'success'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "🚀 [${{ steps.meta.outputs.environment_tag_value }}] 백엔드 배포 성공"

      - name: Notify Discord - Failure
        if: steps.health_check.outcome == 'failure'
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "🚨 [${{ steps.meta.outputs.environment_tag_value }}] 백엔드 배포 실패"

      - name: Fail workflow if health check failed
        if: steps.health_check.outcome == 'failure'
        run: exit 1