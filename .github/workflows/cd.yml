name: Backend CD

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths-ignore:
      - "**.md"
      - ".github/**"
      - ".git*"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'scuad-backend' }}

jobs:
  build-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ----------------------------
      # 1. AWS 인증 + ECR 로그인
      # ----------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------
      # 2. 브랜치별 태그 결정
      # ----------------------------
      - name: Set image tag config
        id: config
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF_NAME}"

          if [ "$BRANCH" == "main" ]; then
            echo "tag_latest=main-latest" >> $GITHUB_OUTPUT
            echo "tag_sha=main-${SHA_SHORT}" >> $GITHUB_OUTPUT
            echo "env_label=PROD" >> $GITHUB_OUTPUT
          else
            echo "tag_latest=develop-latest" >> $GITHUB_OUTPUT
            echo "tag_sha=develop-${SHA_SHORT}" >> $GITHUB_OUTPUT
            echo "env_label=DEV" >> $GITHUB_OUTPUT
          fi

      # ----------------------------
      # 3. Docker Build & Push
      # ----------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.config.outputs.tag_latest }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.config.outputs.tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ----------------------------
      # 4. Discord 알림
      # ----------------------------
      - name: Notify Discord - Success
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: success
          title: "[${{ steps.config.outputs.env_label }}] BE 이미지 푸시 완료"
          description: |
            Image: `${{ env.ECR_REPOSITORY }}:${{ steps.config.outputs.tag_sha }}`

      - name: Notify Discord - Failure
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: failure
          title: "[${{ steps.config.outputs.env_label }}] BE 이미지 푸시 실패"
          description: |
            Image: `${{ env.ECR_REPOSITORY }}:${{ steps.config.outputs.tag_sha }}`
