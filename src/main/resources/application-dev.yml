spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_SCHEMA:example}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  flyway: 
      enabled: false  # dev는 flyway 비활성화 (또는 enabled: true + locations 명시)

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  frontend-url: ${APP_FRONTEND_URL:https://dev.scuad.kr}
  cookie-domain: ${APP_COOKIE_DOMAIN:.dev.scuad.kr}